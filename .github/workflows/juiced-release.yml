name: Juiced container release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
concurrency:
  group: juiced-container-publication
  cancel-in-progress: false
jobs:
  service-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: juiced/rewrite
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Build daemon and fixture executables
        run: cargo build --all-features --locked
      - name: Service contracts
        run: cargo test -p juiced-service --features test-fixture --locked
      - name: Process and socket API pipelines
        run: cargo test -p juiced-rust-tests --locked
      - name: Formatting and lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --features test-fixture --locked -- -D warnings

  console-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: juiced/rewrite/ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install the pinned Rust toolchain for the fixture service
        working-directory: juiced/rewrite
        run: rustup toolchain install
      - name: Install console dependencies and browser
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Console unit tests and production build
        run: |
          bun test ./test
          bun run build
      - name: Plan and API inventory integrity
        working-directory: juiced/rewrite
        run: |
          bun test scripts/plan.test.ts
          bun catalog-design/inventory.ts --check --native-root ../..
          bun api-parity/inventory.ts --check
          bun test api-parity/inventory.test.ts
      - name: Build the fixture service before Playwright starts it
        working-directory: juiced/rewrite
        run: cargo build --all-features --locked
      - name: Operator browser journeys against the Rust service
        run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: console-browser-evidence
          path: |
            juiced/rewrite/ui/playwright-report/
            juiced/rewrite/ui/test-results/

  image:
    needs: [service-checks, console-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      IMAGE: ghcr.io/nulifyer/juiced:${{ github.ref_type == 'tag' && github.ref_name || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Release version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version=development; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the appliance image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: juiced/rewrite/container/Containerfile
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SERVICE_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=juiced-appliance
          cache-to: type=gha,mode=max,scope=juiced-appliance
      - name: Smoke-test the exact image
        run: SKIP_BUILD=1 CONTAINER_ENGINE=docker JUICED_IMAGE="$IMAGE" EXPECT_VERSION="${{ steps.version.outputs.version }}" juiced/rewrite/container/smoke-test.sh
      - name: Publish accepted image
        run: |
          docker push "$IMAGE"
          if [ "${{ github.ref_type }}" = tag ] && [[ "${{ github.ref_name }}" != *-* ]]; then
            docker tag "$IMAGE" ghcr.io/nulifyer/juiced:latest
            docker push ghcr.io/nulifyer/juiced:latest
          fi
          docker inspect "$IMAGE" --format '{{json .RepoDigests}}' > image-digest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-identity
          path: image-digest.json
