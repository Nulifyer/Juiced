name: Juiced rewrite image
on:
  workflow_dispatch:
  push:
    tags: ['rewrite-v*']
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nulifyer/juiced:${{ github.ref_type == 'tag' && github.ref_name || 'rewrite-development' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the rewrite appliance image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: juiced/rewrite/container/Containerfile
          build-args: SOURCE_REVISION=${{ github.sha }}
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=juiced-rewrite
          cache-to: type=gha,mode=max,scope=juiced-rewrite
      - name: Smoke-test the exact image before publishing
        run: SKIP_BUILD=1 CONTAINER_ENGINE=docker JUICED_IMAGE="$IMAGE" juiced/rewrite/container/smoke-test.sh
      - name: Publish
        run: |
          docker push "$IMAGE"
          if [ "${{ github.ref_type }}" = tag ]; then
            docker tag "$IMAGE" ghcr.io/nulifyer/juiced:rewrite-preview
            docker push ghcr.io/nulifyer/juiced:rewrite-preview
          fi
