site_name: Juiced user guides
site_description: Install Juiced, manage local models, and connect your applications.
repo_name: Nulifyer/Juiced
repo_url: https://github.com/Nulifyer/Juiced
edit_uri: edit/main/docs/

plugins:
  - search

theme:
  name: material
  logo: assets/juiced-icon.svg
  favicon: assets/juiced-icon.svg
  features:
    - navigation.footer
    - navigation.tracking
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - User guides: README.md
  - Get started:
      - Your first model: guide/README.md
      - Install Juiced: guide/install/README.md
      - Access and API keys: guide/access.md
  - Manage models:
      - Download or import: guide/models.md
      - Runtimes and hardware: guide/runtimes.md
      - Loading policies: guide/loading-policy.md
      - Model settings: guide/settings.md
      - Prepare another quant: guide/preparation.md
      - Cache and storage: guide/cache.md
  - Use services:
      - Test services: guide/testing.md
      - Command-line client: guide/cli.md
      - Connect an application: integrations/README.md
      - Coding clients and Pi: integrations/pi.md
      - Home Assistant speech: integrations/home-assistant.md
  - API examples:
      - Choose an interface: api/README.md
      - OpenAI: api/openai.md
      - Ollama: api/ollama.md
      - Anthropic: api/anthropic.md
      - AUTOMATIC1111: api/automatic1111.md
      - MCP: api/mcp.md
      - llama.cpp operations: api/llamacpp.md
      - Juiced management: api/juiced.md
      - Native compatibility: api/lemonade.md
  - Operate your server:
      - Diagnostics: guide/diagnostics.md
      - Update and recovery: guide/maintenance.md
      - Troubleshooting: guide/troubleshooting.md
  - Credits: credits.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
